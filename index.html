<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>FKK Strand Finder</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIINfQ3pL8w8Q2jQm5Qw5Q0Qw0Qw0Qw0Qw0="
    crossorigin=""/>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>🏖️ FKK Strand Finder</h1>

    <button id="locateBtn">📍 Meinen Standort verwenden</button>

    <label for="radius">Suchradius: <strong><span id="radiusValue">25</span> km</strong></label>
    <input id="radius" type="range" min="5" max="100" value="25" step="5">

    <div id="status">Standort wird noch nicht verwendet.</div>
    <div id="map"></div>

    <section>
      <h2>Gefundene FKK-Orte</h2>
      <div id="results"></div>
    </section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modalBox">
      <button id="closeModal" class="close">×</button>
      <h2 id="modalTitle"></h2>
      <p id="modalText"></p>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2M2m2q7fJ9QqJQqJQqJQqJQ="
    crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
